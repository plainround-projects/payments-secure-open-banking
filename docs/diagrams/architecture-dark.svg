<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="t d">
<title id="t">Architecture of payments-secure-open-banking</title>
<desc id="d">The Customer authenticates directly at the Bank login inside the mock bank, which sends a one-time code to the Mock bank's phone and creates a consent in Accounts and consents. The Merchant service never touches that path: it asks the customer for approval through checkout, then calls the Payment API with a token bound to its own key and a signed request. The Payment API checks the consent and posts the payment once in Accounts and consents. An amber note marks a changed amount, which is refused.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="839" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="838" rx="16"/>
<text class="title" x="48" y="68">The bank checks the customer and the merchant separately</text>
<text class="caption" x="48" y="100">Two trust paths: the customer proves who they are at the bank, the merchant proves which merchant it is.</text>
<rect class="actor" x="48" y="176" width="200" height="96" rx="48"/>
<text class="name" x="148" y="220" text-anchor="middle">Customer</text>
<text class="sub" x="148" y="242" text-anchor="middle">bank app, PIN, code</text>
<rect class="svc" x="48" y="480" width="224" height="112" rx="12"/>
<text class="name" x="64" y="512">Merchant service</text>
<text class="sub" x="64" y="536">checkout, signed calls</text>
<text class="sub" x="64" y="558">own key and secret</text>
<text class="sub" x="64" y="580">no database</text>
<rect class="zone" x="380" y="132" width="772" height="628" rx="14"/>
<text class="tag b t-accent" x="396" y="158">Mock bank: the only place that decides</text>
<rect class="svc" x="420" y="176" width="240" height="112" rx="12"/>
<text class="name" x="436" y="208">Bank login</text>
<text class="sub" x="436" y="232">strong authentication</text>
<text class="sub" x="436" y="254">PIN, one-time code</text>
<text class="sub" x="436" y="276">single-use proof</text>
<rect class="svc" x="420" y="340" width="240" height="84" rx="12"/>
<text class="name" x="436" y="372">Mock bank's phone</text>
<text class="sub" x="436" y="396">a file the owner reads</text>
<text class="sub" x="436" y="418">code held in clear</text>
<rect class="svc" x="420" y="480" width="240" height="112" rx="12"/>
<text class="name" x="436" y="512">Payment API</text>
<text class="sub" x="436" y="536">merchant token + proof</text>
<text class="sub" x="436" y="558">checks every rule</text>
<text class="sub" x="436" y="580">pays once, signs result</text>
<path class="store" d="M840 262a140 12 0 0 1 280 0v128a140 12 0 0 1 -280 0z"/>
<path class="rim" d="M840 262a140 12 0 0 0 280 0"/>
<text class="name" x="980" y="300" text-anchor="middle">Accounts and consents</text>
<text class="sub" x="980" y="324" text-anchor="middle">ledger, balances</text>
<text class="sub" x="980" y="348" text-anchor="middle">consents, payments</text>
<text class="sub" x="980" y="372" text-anchor="middle">idempotency keys</text>
<rect class="note" x="420" y="640" width="340" height="100" rx="10"/>
<text class="label b t-warn" x="436" y="670">amount changed after signing</text>
<text class="sub" x="436" y="696">400 request_not_as_signed</text>
<text class="sub" x="436" y="718">nothing is posted</text>
<path class="sync" d="M248 204H420"/>
<text class="label t-accent" x="260" y="194">PIN, code</text>
<text class="label t-accent" x="260" y="226">consent</text>
<path class="async" d="M540 288V340"/>
<text class="label t-accent" x="552" y="320">code</text>
<path class="read" d="M420 382H320Q308 382 308 370V256Q308 244 296 244H248"/>
<path class="sync" d="M100 272V480"/>
<text class="label t-accent" x="112" y="380">checkout</text>
<path class="ok" d="M200 480V272"/>
<text class="label t-good" x="212" y="440">the terms</text>
<path class="sync" d="M272 536H420"/>
<text class="label t-accent" x="284" y="526">signed</text>
<path class="sync" d="M660 280H840"/>
<text class="label t-accent" x="680" y="270">consent</text>
<path class="sync" d="M660 520H760Q772 520 772 508V392Q772 380 784 380H840"/>
<text class="label t-accent" x="670" y="510">post once</text>
<path class="sync" d="M48 796H112"/><text class="legend" x="124" y="801">sync call</text>
<path class="async" d="M264 796H328"/><text class="legend" x="340" y="801">async message</text>
<path class="read" d="M520 796H584"/><text class="legend" x="596" y="801">read</text>
</svg>
